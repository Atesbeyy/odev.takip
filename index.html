<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ödev Takip"><title>Ödev Takip</title><style>
:root{--bg:#f5f7ff;--card:#fff;--text:#171927;--muted:#74798b;--line:#e7e9f2;--accent:#625df5;--accent2:#817cff;--ok:#20a66a;--shadow:0 10px 30px #25265b12}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef0ff 0,#f8f9ff 42%,#f5f7ff 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.hero{padding:10px 2px 18px;display:flex;justify-content:space-between;align-items:flex-end}.eyebrow{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.3px}.title{font-size:34px;line-height:1.05;font-weight:800;margin:5px 0 0;letter-spacing:-1.3px}.sub{margin-top:7px;color:var(--muted);font-size:14px}.add{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:28px;box-shadow:0 9px 20px #625df53d}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.stat{background:#ffffffc9;border:1px solid #fff;border-radius:20px;padding:15px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.stat b{font-size:24px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.panel{background:#ffffffd9;border:1px solid #fff;border-radius:24px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);margin-bottom:16px}.panel h2{font-size:18px;margin:0 0 14px}.formgrid{display:grid;gap:10px}.field{background:#f4f5fb;border:1px solid transparent;border-radius:15px;padding:11px 13px}.field:focus-within{border-color:#b7b4ff;background:#fff}.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}.field input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.save{width:100%;padding:14px;border-radius:15px;background:var(--text);color:#fff;font-weight:750;margin-top:2px}.cancel{width:100%;padding:11px;background:transparent;color:var(--muted);font-size:14px}.empty{text-align:center;padding:34px 12px;color:var(--muted)}.empty .emoji{font-size:42px}.empty b{display:block;color:var(--text);font-size:17px;margin:10px 0 5px}.task{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:11px;box-shadow:0 6px 18px #25265b0a}.task.done{opacity:.72}.top{display:flex;align-items:center;gap:10px}.num{width:30px;height:30px;border-radius:10px;background:#eeedff;color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800}.lesson{font-weight:800;font-size:16px}.pub{margin-left:auto;color:var(--muted);font-size:12px}.topic{font-size:14px;margin:11px 0 10px}.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#f3f4f8;border-radius:10px;padding:7px 9px;font-size:12px;color:#555a6d}.status{width:100%;margin-top:12px;border-radius:12px;padding:11px;font-weight:750;background:#f0f1f7;color:#555a6d}.status.done{background:#e7f8ef;color:var(--ok)}.hidden{display:none!important}@media(min-width:600px){.formgrid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
</style></head><body><main class="app"><header class="hero"><div><div class="eyebrow">DERS PLANI</div><div class="title">Ödev Takip 📚</div><div class="sub" id="today"></div></div><button class="add" id="addBtn" aria-label="Yeni ödev">＋</button></header><section class="stats"><div class="stat"><b id="total">0</b><span>Toplam ödev</span></div><div class="stat"><b id="left">0</b><span>Bekleyen</span></div></section><section class="panel hidden" id="formPanel"><h2>Yeni Ödev ✨</h2><div class="formgrid"><div class="field"><label>DERS</label><input id="lesson" placeholder="TYT" autocomplete="off"></div><div class="field"><label>YAYIN</label><input id="publisher" placeholder="345" autocomplete="off"></div><div class="field full"><label>KONU</label><input id="topic" placeholder="Bölme" autocomplete="off"></div><div class="field"><label>SAYFA / TEST</label><input id="pages" placeholder="100-150" autocomplete="off"></div><div class="field"><label>TARİH</label><input id="date" type="date"></div><button class="save full" id="saveBtn">Ödevi Kaydet</button><button class="cancel full" id="cancelBtn">Vazgeç</button></div></section><section id="list"></section></main><script>
const KEY='odev_takip_apple_v1';let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));
$('today').textContent=new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
function render(){const list=$('list');$('total').textContent=tasks.length;$('left').textContent=tasks.filter(x=>!x.done).length;if(!tasks.length){list.innerHTML='<div class="panel empty"><div class="emoji">📝</div><b>Henüz ödev yok</b><span>İlk ödevini ekleyerek başlayalım.</span></div>';return}list.innerHTML=tasks.map((t,i)=>`<article class="task ${t.done?'done':''}"><div class="top"><div class="num">${i+1}</div><div class="lesson">${esc(t.lesson)}</div><div class="pub">${esc(t.publisher)}</div></div><div class="topic">${esc(t.topic)}</div><div class="meta"><span class="pill">📖 ${esc(t.pages)}</span><span class="pill">📅 ${formatDate(t.date)}</span></div><button class="status ${t.done?'done':''}" data-i="${i}">${t.done?'✓ Tamamlandı':'○ Tamamlanmadı'}</button></article>`).join('');list.querySelectorAll('.status').forEach(b=>b.onclick=()=>{tasks[+b.dataset.i].done=!tasks[+b.dataset.i].done;save();render()})}
function esc(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function formatDate(v){if(!v)return '-';const [y,m,d]=v.split('-');return `${d}/${m}/${y.slice(2)}`}
$('addBtn').onclick=()=>{$('formPanel').classList.remove('hidden');$('lesson').focus();window.scrollTo({top:0,behavior:'smooth'})};$('cancelBtn').onclick=()=>{$('formPanel').classList.add('hidden')};$('saveBtn').onclick=()=>{const t={lesson:$('lesson').value.trim(),publisher:$('publisher').value.trim(),topic:$('topic').value.trim(),pages:$('pages').value.trim(),date:$('date').value,done:false};if(!t.lesson||!t.topic){alert('Ders ve konu alanlarını doldur kral 😄');return}tasks.push(t);save();['lesson','publisher','topic','pages','date'].forEach(id=>$(id).value='');$('formPanel').classList.add('hidden');render()};render();
</script></body></html>
